name: Badge Display

on:
  push:
    branches: [feat/ble-display]
    paths-ignore: ['**/*.md']
  pull_request:
    paths:
      - 'firmware/display/**'
      - 'tools/qix-ble/**'
      - 'scripts/*display*'
      - 'scripts/import-sdk.py'
      - 'scripts/prepare-badge-system.py'
      - 'tools/make_badge_fonts.py'
      - 'tools/fonts/**'
      - 'tests/**'
      - '.github/workflows/badge-display.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: display-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'tools/qix-ble[dev]' pillow fonttools
      - run: >-
          python -m pytest -q tests/test_font_pack.py tools/qix-ble/tests/test_display.py
          tools/qix-ble/tests/test_windows_ota_size.py
          tools/qix-ble/tests/test_transport_write_timeout.py
          tools/qix-ble/tests/test_update_manager.py
          tools/qix-ble/tests/test_frame.py tests/test_display_overlay.py tests/test_system_overlay.py tests/test_sdk_import.py
          tools/qix-ble/tests/test_power.py
      - run: python scripts/test-display-native.py

  firmware:
    needs: tests
    # Build only our explicit development branch or a manual run, never a fork PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository_owner == 'vasilievh')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDK_COMMIT: d0167685d032d745d88fe50233302edd46941622
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # GitHub runners are fresh VMs, so without a cache every run re-downloads
      # the vendor SDK. The key covers the pinned commit and the importer (which
      # holds the expected sha256), so a pin bump automatically misses the cache.
      # actions/cache only saves after a successful job, so a zip that failed
      # checksum verification never lands in the cache.
      - name: Restore pinned SDK archive from cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/badge-sdk/e87-sdk.zip
          key: e87-sdk-${{ env.SDK_COMMIT }}-${{ hashFiles('scripts/import-sdk.py') }}
      - name: Download pinned SDK source archive
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/badge-sdk
          curl --fail --location --connect-timeout 20 --max-time 900 --retry 2 --retry-delay 5 \
            "https://gitlab.zh-jieli.com/api/v4/projects/1463/repository/archive.zip?sha=${SDK_COMMIT}" \
            --output ~/.cache/badge-sdk/e87-sdk.zip.partial
          mv ~/.cache/badge-sdk/e87-sdk.zip.partial ~/.cache/badge-sdk/e87-sdk.zip
      - name: Verify and import SDK archive
        run: python scripts/import-sdk.py ~/.cache/badge-sdk/e87-sdk.zip
      # setup-jieli-toolchain.sh already skips the download when the archive is
      # in tools/jieli-toolchain/.cache and still checks its sha256.
      - name: Restore compiler archive from cache
        uses: actions/cache@v4
        with:
          path: tools/jieli-toolchain/.cache
          key: jieli-toolchain-${{ hashFiles('scripts/setup-jieli-toolchain.sh') }}
      - name: Install validated compiler
        run: bash scripts/setup-jieli-toolchain.sh
      - name: Fetch pinned SDK and apply upstream badge patch
        run: bash scripts/setup-badge-build.sh --skip-toolchain --skip-postbuild
      - name: Apply Display overlay
        run: python scripts/prepare-display.py
      - name: Apply battery status and optional local identity support
        run: python scripts/prepare-badge-system.py
      - name: Build and package E87 OTA using preserved OEM uboot
        run: bash scripts/build-badge-fw.sh --board e87 --clean --ota firmware-builds/e87-display-v1.ufw
      - name: Record image checksum
        run: sha256sum firmware-builds/e87-display-v1.ufw > firmware-builds/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: e87-display-v1
          path: |
            firmware-builds/e87-display-v1.ufw
            firmware-builds/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
